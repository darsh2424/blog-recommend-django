{% extends 'admin_management/base.html' %}
{% block content %}
<div class="space-y-6">

  <!-- Controls: global default range (optional) -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div class="flex items-center gap-3">
      <label class="text-sm text-gray-600">Default range:</label>
      <button id="last7Btn" class="px-3 py-1 bg-gray-100 rounded text-sm hover:bg-gray-200">Last 7 days</button>
      <button id="last30Btn" class="px-3 py-1 bg-gray-100 rounded text-sm hover:bg-gray-200">Last 30 days</button>
    </div>
    <div class="text-sm text-gray-500">Tip: use chart expand (🔍) to open details and change dates there.</div>
  </div>

  <!-- Grid of charts -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- User Growth -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">User Growth Trend</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="ug_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="ug_end" class="text-sm border rounded px-2 py-1">
          <button id="ug_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="userGrowth" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="userGrowthChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

    <!-- Daily Active Users -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">Daily Active Users</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="dau_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="dau_end" class="text-sm border rounded px-2 py-1">
          <button id="dau_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="dau" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="dauChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

    <!-- Post Engagement -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">Post Engagement (Likes vs Views)</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="pe_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="pe_end" class="text-sm border rounded px-2 py-1">
          <button id="pe_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="postEngagement" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="postEngagementChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

    <!-- Top 7 Posts (horizontal) -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">Top 7 Posts (by likes)</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="tp_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="tp_end" class="text-sm border rounded px-2 py-1">
          <button id="tp_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="topPosts" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="topPostsChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

    <!-- Category Breakdown -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">Category Breakdown</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="cat_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="cat_end" class="text-sm border rounded px-2 py-1">
          <button id="cat_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="categories" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="categoryChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

    <!-- Reports -->
    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold">Reports</h3>
        <div class="flex items-center gap-2">
          <input type="date" id="r_start" class="text-sm border rounded px-2 py-1">
          <input type="date" id="r_end" class="text-sm border rounded px-2 py-1">
          <button id="r_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
          <button class="px-2 py-1 bg-gray-100 rounded" data-chart="reports" onclick="openExpanded(this)">🔍</button>
        </div>
      </div>
      <div class="chart-container overflow-x-auto">
        <div class="min-w-full">
          <canvas id="reportsChart" class="w-full" style="max-height:360px;"></canvas>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- Expanded Chart Modal -->
<div id="chartModal" class="fixed inset-0 bg-gray-600 bg-opacity-60 hidden items-center justify-center z-50">
  <div class="bg-white rounded-lg p-4 w-[95%] h-[85%] max-w-7xl flex flex-col">
    <div class="flex items-center justify-between mb-3">
      <h3 id="expandedTitle" class="text-lg font-semibold">Chart</h3>
      <div class="flex items-center gap-2">
        <input type="date" id="exp_start" class="text-sm border rounded px-2 py-1">
        <input type="date" id="exp_end" class="text-sm border rounded px-2 py-1">
        <button id="exp_fetch" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Fetch</button>
        <button onclick="closeModal()" class="px-3 py-1 bg-gray-200 rounded">Close</button>
      </div>
    </div>
    <div class="flex-1 overflow-auto">
      <div class="h-full">
        <canvas id="expandedCanvas" class="w-full h-full"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js is already included in base.html -->
<script>
/* --- Helper utilities --- */
const CHART_ENDPOINTS = {
  userGrowth: "{% url 'chart_user_growth' %}",
  dau: "{% url 'chart_daily_active_users' %}",
  postEngagement: "{% url 'chart_post_engagement' %}",
  topPosts: "{% url 'chart_top_posts' %}",
  categories: "{% url 'chart_category_breakdown' %}",
  reports: "{% url 'chart_reports' %}",
};

function todayISO() { return new Date().toISOString().slice(0,10); }
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

// set default inputs to last 7 days
function setDefaultDates() {
  const defaults = { start: daysAgoISO(6), end: todayISO() };
  ['ug','dau','pe','tp','cat','r'].forEach(prefix => {
    const s = document.getElementById(prefix + '_start');
    const e = document.getElementById(prefix + '_end');
    if (s && e) { s.value = defaults.start; e.value = defaults.end; }
  });
  // expanded modal defaults
  document.getElementById('exp_start').value = defaults.start;
  document.getElementById('exp_end').value = defaults.end;
}
setDefaultDates();

// quick global buttons
document.getElementById('last7Btn').addEventListener('click', () => { setDefaultDates(); fetchAllCharts(); });
document.getElementById('last30Btn').addEventListener('click', () => {
  const start = daysAgoISO(29), end = todayISO();
  ['ug','dau','pe','tp','cat','r'].forEach(prefix => {
    const s = document.getElementById(prefix + '_start');
    const e = document.getElementById(prefix + '_end');
    if (s && e) { s.value = start; e.value = end; }
  });
  document.getElementById('exp_start').value = start;
  document.getElementById('exp_end').value = end;
  fetchAllCharts();
});

// small validation
function validateRange(start, end) {
  if (!start || !end) return { ok:false, msg:'Select both start and end dates' };
  const s = new Date(start), e = new Date(end);
  if (s > e) return { ok:false, msg:'Start date cannot be after end date' };
  const diffDays = Math.round((e - s) / (1000*60*60*24)) + 1;
  if (diffDays > 730) return { ok:false, msg:'Range too large (max 2 years)' }; // safety cap
  return { ok:true, days: diffDays };
}

/* --- Chart instances holder --- */
const INSTANCES = {};

/* --- Generic helpers to expand canvas width for many labels (scroll) --- */
function setCanvasWidthByLabels(canvas, labels, perLabelPx = 60, minWidth = 600) {
  const width = Math.max(minWidth, labels.length * perLabelPx);
  canvas.style.width = width + 'px';
}

/* --- Render helpers for each chart type --- */
function clearInstance(key) {
  if (INSTANCES[key]) {
    INSTANCES[key].destroy();
    INSTANCES[key] = null;
  }
}

async function fetchJson(url) {
  const res = await fetch(url, { credentials: 'same-origin' });
  if (!res.ok) throw new Error('Network error: ' + res.status);
  return res.json();
}

/* USER GROWTH (line) */
async function loadUserGrowth(start, end, canvasId='userGrowthChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.userGrowth, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    // raw expected: list of objects with 'period' or 'period' key depending on backend
    // We'll handle both shapes: array of {period: '2023-..', count: X} or {label, value}
    const labels = raw.map(r => r.period || r.label || r.date);
    const values = raw.map(r => r.count || r.value || r.users || r.users_count || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    setCanvasWidthByLabels(document.getElementById(canvasId), labels, 70, 700);
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [{ label: 'New Users', data: values, borderColor: 'rgb(59,130,246)', backgroundColor:'rgba(59,130,246,0.08)', fill:true, tension:0.2 }] },
      options: {
        responsive: false, // false so we can control width and get scrollbar
        maintainAspectRatio: false,
        animation: false,
        scales: { y: { beginAtZero:true } },
        plugins: { legend: { display: true, position: 'bottom' } }
      }
    });
  } catch (err) { console.error(err); alert('Failed loading user growth'); }
}

/* DAU (line) */
async function loadDAU(start, end, canvasId='dauChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.dau, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    const labels = raw.map(r => r.period || r.label || r.date);
    const values = raw.map(r => r.count || r.value || r.active || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    setCanvasWidthByLabels(document.getElementById(canvasId), labels, 70, 700);
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [{ label: 'Active Users', data: values, borderColor: 'rgb(16,185,129)', backgroundColor:'rgba(16,185,129,0.08)', fill:true, tension:0.2 }] },
      options: {
        responsive: false,
        maintainAspectRatio: false,
        animation: false,
        scales: { y: { beginAtZero:true } },
        plugins: { legend: { display: true, position: 'bottom' } }
      }
    });
  } catch (err) { console.error(err); alert('Failed loading DAU'); }
}

/* POST ENGAGEMENT (grouped bar: likes vs views) */
async function loadPostEngagement(start, end, canvasId='postEngagementChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.postEngagement, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    const labels = raw.map(r => r.period || r.label || r.date);
    const likes = raw.map(r => r.likes || r.like_count || 0);
    const views = raw.map(r => r.views || r.view_count || r.views_count || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    setCanvasWidthByLabels(document.getElementById(canvasId), labels, 70, 700);
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Likes', data: likes, backgroundColor: 'rgba(59,130,246,0.85)' },
          { label: 'Views', data: views, backgroundColor: 'rgba(34,197,94,0.85)' }
        ]
      },
      options: {
        responsive: false,
        maintainAspectRatio: false,
        animation: false,
        scales: { y: { beginAtZero:true } },
        plugins: { legend: { position: 'bottom' } }
      }
    });
  } catch (err) { console.error(err); alert('Failed loading engagement'); }
}

/* TOP POSTS (horizontal) */
async function loadTopPosts(start, end, canvasId='topPostsChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.topPosts, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    const labels = raw.map(r => r.title || r.title_short || '(untitled)');
    const vals = raw.map(r => r.view_count || r.views || r.likes || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    // horizontal bars: ensure minimum height / width so labels readable
    setCanvasWidthByLabels(document.getElementById(canvasId), labels, 12, 600); // perLabelPx small for horizontal bars
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Views / Likes', data: vals, backgroundColor: 'rgba(245,158,11,0.9)' }] },
      options: {
        indexAxis: 'y',
        responsive: false,
        maintainAspectRatio: false,
        animation: false,
        scales: { x: { beginAtZero:true } },
        plugins: { legend: { display: false } }
      }
    });
  } catch (err) { console.error(err); alert('Failed loading top posts'); }
}

/* CATEGORIES (doughnut) */
async function loadCategories(start, end, canvasId='categoryChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.categories, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    const labels = raw.map(r => r.name || r.category || '(none)');
    const vals = raw.map(r => r.post_count || r.posts || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ label: 'Posts', data: vals }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'right' } } }
    });
  } catch (err) { console.error(err); alert('Failed loading categories'); }
}

/* REPORTS (bar/line) */
async function loadReports(start, end, canvasId='reportsChart') {
  const valid = validateRange(start, end);
  if (!valid.ok) { alert(valid.msg); return; }
  try {
    const url = new URL(CHART_ENDPOINTS.reports, window.location.origin);
    url.searchParams.set('start', start); url.searchParams.set('end', end);
    const raw = await fetchJson(url);
    const labels = raw.map(r => r.period || r.label || r.date);
    const vals = raw.map(r => r.count || r.value || r.reports || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    clearInstance(canvasId);
    setCanvasWidthByLabels(document.getElementById(canvasId), labels, 70, 700);
    INSTANCES[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Reports', data: vals, backgroundColor:'rgba(244,63,94,0.9)' }] },
      options: { responsive:false, maintainAspectRatio:false, animation:false, scales:{ y:{ beginAtZero:true } }, plugins:{ legend:{ display:false } } }
    });
  } catch (err) { console.error(err); alert('Failed loading reports'); }
}

/* --- Expand modal logic --- */
let activeChartKey = null;
function openExpanded(btn) {
  const key = btn.getAttribute('data-chart');
  activeChartKey = key;
  document.getElementById('chartModal').classList.remove('hidden');
  document.getElementById('chartModal').classList.add('flex');
  document.getElementById('expandedTitle').textContent = {
    userGrowth: 'User Growth Trend',
    dau: 'Daily Active Users',
    postEngagement: 'Post Engagement',
    topPosts: 'Top Posts',
    categories: 'Category Breakdown',
    reports: 'Reports'
  }[key] || 'Chart';
  // populate modal dates from small controls if present
  const mapPref = { userGrowth: 'ug', dau:'dau', postEngagement:'pe', topPosts:'tp', categories:'cat', reports:'r' };
  const pref = mapPref[key];
  const s = document.getElementById(pref + '_start')?.value || daysAgoISO(6);
  const e = document.getElementById(pref + '_end')?.value || todayISO();
  document.getElementById('exp_start').value = s;
  document.getElementById('exp_end').value = e;

  // initial load into expanded canvas
  updateExpandedChart();
}

function closeModal() {
  document.getElementById('chartModal').classList.add('hidden');
  document.getElementById('chartModal').classList.remove('flex');
  // destroy expanded chart if exists
  if (INSTANCES['expanded']) { INSTANCES['expanded'].destroy(); INSTANCES['expanded'] = null; }
}

document.getElementById('exp_fetch').addEventListener('click', updateExpandedChart);

async function updateExpandedChart() {
  const start = document.getElementById('exp_start').value;
  const end = document.getElementById('exp_end').value;
  const key = activeChartKey;
  if (!key) return;
  // call respective loader with expanded canvas id
  const mapLoader = {
    userGrowth: loadUserGrowth,
    dau: loadDAU,
    postEngagement: loadPostEngagement,
    topPosts: loadTopPosts,
    categories: loadCategories,
    reports: loadReports
  };
  const loader = mapLoader[key];
  if (!loader) return;
  // render into expanded canvas (id expandedCanvas)
  await loader(start, end, 'expandedCanvas');
  // move expanded instance to INSTANCES['expanded'] for consistent cleanup
  if (INSTANCES['expanded']) INSTANCES['expanded'].destroy();
  INSTANCES['expanded'] = INSTANCES['expandedCanvas'] || INSTANCES['expandedCanvas'] === undefined ? INSTANCES['expandedCanvas'] : INSTANCES['expandedCanvas'];
  // note: loaders create chart instance keyed by the canvasId; loader returns no instance; but INSTANCES[...] keys are set inside loader using canvasId
  // ensure we remap the created instance to 'expanded'
  // find the instance created for 'expandedCanvas' and remap
  if (INSTANCES['expandedCanvas']) {
    INSTANCES['expanded'] = INSTANCES['expandedCanvas'];
    delete INSTANCES['expandedCanvas'];
  }
}

/* --- Wire small Fetch buttons --- */
document.getElementById('ug_fetch').addEventListener('click', () => loadUserGrowth(document.getElementById('ug_start').value, document.getElementById('ug_end').value));
document.getElementById('dau_fetch').addEventListener('click', () => loadDAU(document.getElementById('dau_start').value, document.getElementById('dau_end').value));
document.getElementById('pe_fetch').addEventListener('click', () => loadPostEngagement(document.getElementById('pe_start').value, document.getElementById('pe_end').value));
document.getElementById('tp_fetch').addEventListener('click', () => loadTopPosts(document.getElementById('tp_start').value, document.getElementById('tp_end').value));
document.getElementById('cat_fetch').addEventListener('click', () => loadCategories(document.getElementById('cat_start').value, document.getElementById('cat_end').value));
document.getElementById('r_fetch').addEventListener('click', () => loadReports(document.getElementById('r_start').value, document.getElementById('r_end').value));

/* --- Initial load (defaults last 7 days) --- */
async function fetchAllCharts() {
  const start = daysAgoISO(6), end = todayISO();
  await Promise.all([
    loadUserGrowth(start, end),
    loadDAU(start, end),
    loadPostEngagement(start, end),
    loadTopPosts(start, end),
    loadCategories(start, end),
    loadReports(start, end)
  ]);
}
fetchAllCharts();

</script>
{% endblock %}
