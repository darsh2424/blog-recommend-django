{% extends 'admin_management/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dashboard Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="summary-cards">
        <!-- Cards will be populated by JavaScript -->
    </div>

    <!-- Date Range Selector -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <h3 class="text-lg font-semibold text-gray-900">Select Date Range</h3>
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-2">
                    <label for="recStartDate" class="text-sm font-medium text-gray-700">From:</label>
                    <input type="date" id="recStartDate" class="border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div class="flex items-center gap-2">
                    <label for="recEndDate" class="text-sm font-medium text-gray-700">To:</label>
                    <input type="date" id="recEndDate" class="border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <!-- <select id="groupBy" class="border border-gray-300 rounded px-3 py-2 text-sm">
                    <option value="day">Daily</option>
                    <option value="week">Weekly</option>
                    <option value="month">Monthly</option>
                </select> -->
                <button id="applyRecDateRange" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium">
                    Apply
                </button>
                <button id="resetRecDateRange" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded text-sm font-medium">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- CTR Over Time -->
        <div class="bg-white p-6 rounded-lg shadow-lg chart-container" data-chart-type="rec_ctr">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">CTR Over Time</h3>
                <button class="refresh-btn text-gray-500 hover:text-gray-700 p-1 rounded-full hover:bg-gray-50">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="relative h-80">
                <canvas id="recCtrChart"></canvas>
            </div>
        </div>

        <!-- Engagement Over Time -->
        <div class="bg-white p-6 rounded-lg shadow-lg chart-container" data-chart-type="rec_engagement">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Engagement Rate Over Time</h3>
                <button class="refresh-btn text-gray-500 hover:text-gray-700 p-1 rounded-full hover:bg-gray-50">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="relative h-80">
                <canvas id="recEngagementChart"></canvas>
            </div>
        </div>

        <!-- Category Distribution -->
        <div class="bg-white p-6 rounded-lg shadow-lg chart-container" data-chart-type="rec_category">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Recommendations by Category</h3>
                <button class="refresh-btn text-gray-500 hover:text-gray-700 p-1 rounded-full hover:bg-gray-50">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="relative h-80">
                <canvas id="recCategoryChart"></canvas>
            </div>
        </div>

        <!-- Tier Effectiveness -->
        <!-- <div class="bg-white p-6 rounded-lg shadow-lg chart-container" data-chart-type="rec_tier">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Tier Effectiveness (CTR & ER)</h3>
                <button class="refresh-btn text-gray-500 hover:text-gray-700 p-1 rounded-full hover:bg-gray-50">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="relative h-80">
                <canvas id="recTierChart"></canvas>
            </div>
        </div> -->

        <!-- Fairness -->
        <div class="bg-white p-6 rounded-lg shadow-lg chart-container" data-chart-type="rec_fairness">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Distribution Fairness (Top Authors)</h3>
                <button class="refresh-btn text-gray-500 hover:text-gray-700 p-1 rounded-full hover:bg-gray-50">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="relative h-80">
                <canvas id="recFairnessChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Store chart instances for later updates
const chartInstances = {};

document.addEventListener('DOMContentLoaded', function() {
    // Set default date range (last 7 days)
    const today = new Date();
    const lastWeek = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
    
    document.getElementById('recStartDate').value = formatDate(lastWeek);
    document.getElementById('recEndDate').value = formatDate(today);
    
    // Load all charts and summary data
    loadAllCharts();
    
    // Set up event listeners
    document.getElementById('applyRecDateRange').addEventListener('click', loadAllCharts);
    document.getElementById('resetRecDateRange').addEventListener('click', resetDateRange);
    
    // Add refresh button functionality
    document.querySelectorAll('.refresh-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const chartType = this.closest('.chart-container').dataset.chartType;
            loadChart(chartType);
        });
    });
});

function formatDate(date) {
    return date.toISOString().split('T')[0];
}

function resetDateRange() {
    const today = new Date();
    const lastWeek = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
    
    document.getElementById('recStartDate').value = formatDate(lastWeek);
    document.getElementById('recEndDate').value = formatDate(today);
    // document.getElementById('groupBy').value = 'day';
    
    loadAllCharts();
}

async function loadAllCharts() {
    // Load summary stats first
    await loadSummaryStats();
    
    // Load all charts
    loadChart('rec_ctr');
    loadChart('rec_engagement');
    loadChart('rec_category');
    loadChart('rec_tier');
    loadChart('rec_fairness');
}

async function loadSummaryStats() {
    const startDate = document.getElementById('recStartDate').value;
    const endDate = document.getElementById('recEndDate').value;
    
    try {
        const response = await fetch(
            `/admin_management/recommendations-dashboard/data/?chart_type=rec_summary&start_date=${startDate}&end_date=${endDate}`
        );
        
        if (!response.ok) {
            throw new Error('Failed to fetch summary data');
        }
        
        const data = await response.json();
        updateSummaryCards(data);
    } catch (error) {
        console.error('Error loading summary stats:', error);
        showError('summary-cards', 'Failed to load summary statistics');
    }
}

function updateSummaryCards(data) {
    const summaryCards = document.getElementById('summary-cards');
    
    summaryCards.innerHTML = `
        <!-- Total Recommendations Card -->
        <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Total Recommendations</p>
                    <h3 class="text-2xl font-bold text-gray-900">${data.total_recommendations.toLocaleString()}</h3>
                </div>
                <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                    <i class="fas fa-random text-xl"></i>
                </div>
            </div>
        </div>

        <!-- CTR Card -->
        <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Average CTR</p>
                    <h3 class="text-2xl font-bold text-gray-900">${data.ctr}%</h3>
                </div>
                <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                    <i class="fas fa-mouse-pointer text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Engagement Rate Card -->
        <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Engagement Rate</p>
                    <h3 class="text-2xl font-bold text-gray-900">${data.engagement_rate}%</h3>
                </div>
                <div class="p-3 rounded-full bg-green-100 text-green-600">
                    <i class="fas fa-heart text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Bounce Rate Card -->
        <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Bounce Rate</p>
                    <h3 class="text-2xl font-bold text-gray-900">${data.bounce_rate}%</h3>
                </div>
                <div class="p-3 rounded-full bg-red-100 text-red-600">
                    <i class="fas fa-times-circle text-xl"></i>
                </div>
            </div>
        </div>
    `;
}

async function loadChart(chartType) {
    const startDate = document.getElementById('recStartDate').value;
    const endDate = document.getElementById('recEndDate').value;
    // const groupBy = document.getElementById('groupBy').value;
    
    const canvasId = getCanvasId(chartType);
    const canvasElement = document.getElementById(canvasId);
    
    if (!canvasElement) {
        console.error(`Canvas element with id ${canvasId} not found`);
        return;
    }
    
    // Show loading state
    canvasElement.closest('.chart-container').classList.add('opacity-50');
    
    try {
        const response = await fetch(
            `/admin_management/recommendations-dashboard/data/?chart_type=${chartType}&start_date=${startDate}&end_date=${endDate}`
        );
        
        if (!response.ok) {
            throw new Error(`Failed to fetch data for ${chartType}`);
        }
        
        const data = await response.json();
        
        // Destroy existing chart if it exists
        if (chartInstances[chartType]) {
            chartInstances[chartType].destroy();
        }
        
        // Create new chart
        const ctx = canvasElement.getContext('2d');
        chartInstances[chartType] = new Chart(ctx, getChartConfig(chartType, data));
        
    } catch (error) {
        console.error(`Error loading chart ${chartType}:`, error);
        showError(canvasId, 'Failed to load chart data');
    } finally {
        // Remove loading state
        canvasElement.closest('.chart-container').classList.remove('opacity-50');
    }
}

function getCanvasId(chartType) {
    const mapping = {
        'rec_ctr': 'recCtrChart',
        'rec_engagement': 'recEngagementChart',
        'rec_category': 'recCategoryChart',
        'rec_tier': 'recTierChart',
        'rec_fairness': 'recFairnessChart'
    };
    return mapping[chartType] || '';
}

function getChartConfig(chartType, data) {
    const baseConfig = {
        responsive: true,
        maintainAspectRatio: false
    };
    
    switch(chartType) {
        case 'rec_ctr':
        case 'rec_engagement':
            return {
                ...baseConfig,
                type: 'line',
                data: data,
                options: {
                    plugins: {
                        title: {
                            display: true,
                            text: chartType === 'rec_ctr' ? 'Click-Through Rate Over Time' : 'Engagement Rate Over Time'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            };
            
        case 'rec_category':
        case 'rec_fairness':
            return {
                ...baseConfig,
                type: 'doughnut',
                data: data,
                options: {
                    plugins: {
                        legend: {
                            position: 'right',
                        }
                    }
                }
            };
            
        case 'rec_tier':
            return {
                ...baseConfig,
                type: 'bar',
                data: data,
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            };
            
        default:
            return baseConfig;
    }
}

function showError(elementId, message) {
    const element = document.getElementById(elementId);
    if (element) {
        element.innerHTML = `
            <div class="flex items-center justify-center h-full text-red-500">
                <i class="fas fa-exclamation-circle mr-2"></i>
                ${message}
            </div>
        `;
    }
}
</script>

<style>
.chart-container {
    transition: opacity 0.3s ease;
}
</style>
{% endblock %}
