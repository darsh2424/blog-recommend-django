<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-bg {
            min-height: 100vh;
        }
        .login-card {
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-group {
            position: relative;
        }
        .floating-label {
            position: absolute;
            left: 12px;
            top: 16px;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .form-input:focus + .floating-label,
        .form-input:not(:placeholder-shown) + .floating-label {
            top: 2px;
            font-size: 12px;
        }
        .form-input {
            margin-top: 2px;
            font-size: 22px;

        }
    </style>
</head>
<body>
    <div class="login-bg flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="login-card rounded-2xl shadow-2xl p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-white bg-opacity-20 rounded-full mb-4">
                        <i class="fas fa-user-shield text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold  mb-2">Admin Login</h1>
                    <p class="text-opacity-80">Access your dashboard</p>
                </div>

                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-500 border border-red-400 text-red-100{% else %}bg-green-500 border border-green-400 {% endif %}">
                            <div class="flex items-center">
                                <i class="fas {% if message.tags == 'error' %}fa-exclamation-triangle{% else %}fa-check-circle{% endif %} mr-2"></i>
                                {{ message }}
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Login Form -->
                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    
                    <div class="input-group">
                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="form-input w-full px-4 py-4 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg placeholder-transparent focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
                            placeholder="Email"
                            required
                            autocomplete="email"
                        >
                        <label for="email" class="floating-label">
                            <i class="fas fa-envelope mr-2"></i>Email Address
                        </label>
                    </div>


                    <!-- Password Field -->
                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-input w-full px-4 py-4 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg placeholder-transparent focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
                            placeholder="Password"
                            required
                            autocomplete="current-password"
                        >
                        <label for="password" class="floating-label">
                            <i class="fas fa-lock mr-2"></i>Password
                        </label>
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-opacity-60 hover:text-opacity-100 transition-colors"
                        >
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 font-semibold py-4 px-6 rounded-lg transition-all duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In to Dashboard
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script>
        // Password toggle functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // Form validation and loading state
        const loginForm = document.querySelector('form');
        const submitButton = loginForm.querySelector('button[type="submit"]');
        
        loginForm.addEventListener('submit', function(e) {
            // Add loading state
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';
            submitButton.disabled = true;
        });

        // Auto-focus first input
        document.getElementById('username').focus();

        // Handle form validation
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.classList.add('border-red-400');
                } else {
                    this.classList.remove('border-red-400');
                }
            });
        });
    </script>
</body>
</html>
